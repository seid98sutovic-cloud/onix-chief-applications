# fly.toml app configuration file generated for onix-chief-applications
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'onix-chief-applications'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  NOTIFY_EMAIL = 'seid98sutovic@gmail.com'
  SMTP_HOST = 'smtp.gmail.com'
  SMTP_PORT = '587'
  SMTP_SECURE = 'false'
  EMAIL_FROM = 'ONIX Roleplay <seid98sutovic@gmail.com>'
  ADMIN_USERNAME = 'admin'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'onix_chief_data'
  destination = '/app/data'
